; Template for tools/android_release.ini (which remains gitignored for local overrides).
; Copy this file to android_release.ini.
; Used by tools/build_and_upload_android.bat via `release-tool android`.
; NOTE: configparser does not strip inline `;`/`#` comments — keep active values
; bare; put comments on their own lines.

[FTP]
; Login, host, remote_path and public_url_base come from the release tool's
; "kobjolke.com - apps" profile (ftp_profiles.ini in the release-tool checkout).
; Any [FTP] key set here overrides the profile's value.
profile = kobjolke.com - apps
; The APK is renamed to this on upload, so the download URL never changes.
remote_filename = concat.apk

[OldFileHandling]
; Replace the APK in place — a fixed download URL wants no archive copies.
policy = delete

[Build]
; The APK builds in WSL (one-time setup: scripts/android-wsl/setup.sh). Files not
; yet `git add`ed are not built.
command = cmd /c call scripts\android-wsl\build-apk.bat
apk = build/Concat.apk
; There is no debug build; `debug` is not supported.
version_file = tools/android_version.properties
version_file_format = gradle_kts
